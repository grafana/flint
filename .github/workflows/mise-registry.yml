name: Mise registry compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: rust
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.9.11
          sha256: 6e39ee1ffa926a1f64814efbf1d26c3f617255e2a6ba6152e3c8a5135fa5a35f
          cache_key: "{{default}}-{{env.MISE_ENABLE_TOOLS}}"
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Validate curated tool backends
        run: mise run validate-mise-registry
