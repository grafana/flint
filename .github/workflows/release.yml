---
name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bare tag name to release (e.g. v0.20.0, not refs/tags/v0.20.0)"
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Artifact releases pair a focused tool allowlist with cache: false.
      MISE_ENABLE_TOOLS: rust

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            mise_version: v2026.10.0
            mise_sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.10.0
            mise_sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.10.0
            mise_sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.10.0
            mise_sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            mise_version: v2026.10.0
            mise_sha256: 815eb7872e453dcd30ed5e2e478978d2947e34106b6cd4f9cc4d4e51f7761332
          - target: aarch64-apple-darwin
            runner: macos-latest
            mise_version: v2026.10.0
            mise_sha256: 8d2007efdae0c2b64e3955257533e6ec17197bc2fdcbc5dd8f6847f92881deea
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mise_version: v2026.10.0
            mise_sha256: d09c099e6d5fb580fb42590a995a9432d448d63d66dc7521e90f28785bf86ad2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834  # v5.1.0
        with:
          version: ${{ matrix.mise_version }}
          sha256: ${{ matrix.mise_sha256 }}
          install_args: rust
          cache: false

      - name: Install cross
        if: matrix.build-tool == 'cross'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cross

      - name: Build
        shell: bash
        run: ${{ matrix.build-tool || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Archive (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" flint
          # macOS ships shasum; Linux ships sha256sum
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.zip"
          7z a "$ARCHIVE" "./target/${{ matrix.target }}/release/flint.exe"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Stage archive for release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          overwrite: true

      - name: Upload to draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # gh release upload uses GET /releases/tags/{tag}, which returns 404
          # for draft releases. Use the list API to find the release instead.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Error: no release found for tag $TAG" >&2
            exit 1
          fi
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          for asset in "$ARCHIVE" "$ARCHIVE.sha256"; do
            ASSET_NAME=$(basename "$asset")
            # Delete pre-existing asset to support workflow re-runs
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$ASSET_NAME\") | .id" \
              | xargs -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE \
              || true
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=$ASSET_NAME" \
              --data-binary "@$asset"
          done

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Collect release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve release source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sign and verify release manifest
        uses: jdx/packslip@87479dfc6443253dff69601cace5fc6ea07e6df5 # v1.4.0
        with:
          tag: ${{ env.TAG }}
          commit: ${{ steps.source.outputs.commit }}
          artifacts: dist/flint-*.tar.gz dist/flint-*.zip
          bin: flint
          attest: link
          resources: |
            cli-spec/usage/flint=exec:flint usage
            skill/flint=repo:skills/flint
          out: dist
          upload: false

      - name: Upload manifest to draft release
        id: upload-manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use the list API: tag lookup may not find a draft release.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          test -n "$RELEASE_ID"
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "packslip.sigstore.json") | .id' \
            | xargs -r -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "${UPLOAD_URL}?name=packslip.sigstore.json" \
            --data-binary @dist/packslip.sigstore.json

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload-manifest.outputs.release-id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --method PATCH -F draft=false
