---
name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bare tag name to release (e.g. v0.20.0, not refs/tags/v0.20.0)"
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Artifact releases pair a focused tool allowlist with cache: false.
      MISE_ENABLE_TOOLS: rust

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            mise_version: v2026.9.13
            mise_sha256: a72f49916b33ba952ba398046c5cc91a58238f0b718fee1d938206ef2af21c6d
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.9.13
            mise_sha256: a72f49916b33ba952ba398046c5cc91a58238f0b718fee1d938206ef2af21c6d
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.9.13
            mise_sha256: a72f49916b33ba952ba398046c5cc91a58238f0b718fee1d938206ef2af21c6d
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.9.13
            mise_sha256: a72f49916b33ba952ba398046c5cc91a58238f0b718fee1d938206ef2af21c6d
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            mise_version: v2026.9.13
            mise_sha256: 820bda7a3547edf75dd9e9390846cc87219583bef4fe72666f35a4935d330f47
          - target: aarch64-apple-darwin
            runner: macos-latest
            mise_version: v2026.9.13
            mise_sha256: 3977349e71eea611cf25717ddca753172cae6a92597a47bc4b9efada123b237e
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mise_version: v2026.9.13
            mise_sha256: 5f049f26f4d4f689512df65c6d965221983429cafa71ef5f01452f7a446450be

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: ${{ matrix.mise_version }}
          sha256: ${{ matrix.mise_sha256 }}
          install_args: rust
          cache: false

      - name: Install cross
        if: matrix.build-tool == 'cross'
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cross

      - name: Build
        shell: bash
        run: ${{ matrix.build-tool || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Archive (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" flint
          # macOS ships shasum; Linux ships sha256sum
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.zip"
          7z a "$ARCHIVE" "./target/${{ matrix.target }}/release/flint.exe"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Stage archive for release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          overwrite: true

      - name: Upload to draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # gh release upload uses GET /releases/tags/{tag}, which returns 404
          # for draft releases. Use the list API to find the release instead.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Error: no release found for tag $TAG" >&2
            exit 1
          fi
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          for asset in "$ARCHIVE" "$ARCHIVE.sha256"; do
            ASSET_NAME=$(basename "$asset")
            # Delete pre-existing asset to support workflow re-runs
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$ASSET_NAME\") | .id" \
              | xargs -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE \
              || true
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=$ASSET_NAME" \
              --data-binary "@$asset"
          done

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Collect release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve release source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sign and verify release manifest
        uses: jdx/packslip@4920350c39c234c7a969f9775040bd02829f1923 # v1.3.0
        with:
          tag: ${{ env.TAG }}
          commit: ${{ steps.source.outputs.commit }}
          artifacts: dist/flint-*.tar.gz dist/flint-*.zip
          bin: flint
          attest: link
          resources: |
            cli-spec/usage/flint=exec:flint usage
            skill/flint=repo:skills/flint
          out: dist
          upload: false

      - name: Upload manifest to draft release
        id: upload-manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use the list API: tag lookup may not find a draft release.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          test -n "$RELEASE_ID"
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "packslip.sigstore.json") | .id' \
            | xargs -r -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "${UPLOAD_URL}?name=packslip.sigstore.json" \
            --data-binary @dist/packslip.sigstore.json

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload-manifest.outputs.release-id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --method PATCH -F draft=false
