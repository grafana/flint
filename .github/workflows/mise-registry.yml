name: Mise registry compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-26.04
    env:
      MISE_ENABLE_TOOLS: rust
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: v2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          cache_key: "{{default}}-{{env.MISE_ENABLE_TOOLS}}"
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Validate curated tool backends
        run: mise run validate-mise-registry
