name: Mise registry compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: rust
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: v2026.7.18
          sha256: e1fc2899f2bc7dfe9a3553f4c2d5944cf69d11b5f561545504a20f1e11cd6cc5
          cache_key: "{{default}}-{{env.MISE_ENABLE_TOOLS}}"
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Validate curated tool backends
        run: mise run validate-mise-registry
