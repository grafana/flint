[expected]
args = "run --full --fix renovate-deps"
exit = 1
stderr = '''
flint: fixed: renovate-deps — commit before pushing
'''

[expected.followup]
args = "run --full renovate-deps"
exit = 0

[env]
GITHUB_TOKEN = "token"

[expected.files]
".github/renovate-tracked-deps.json" = '''
{
  "meta": {},
  "files": {
    "mise.toml": {
      "mise": [
        "example"
      ]
    }
  },
  "actionMeta": {}
}
'''

[fake_bins]
renovate = '''
#!/bin/sh
set -eu

mode=""
for arg in "$@"; do
  case "$arg" in
    --dry-run=*) mode="${arg#--dry-run=}" ;;
  esac
done

if [ "$mode" = "lookup" ]; then
  printf '%s\n' '{"msg":"packageFiles with updates","config":{"mise":[{"packageFile":"mise.toml","deps":[{"depName":"example","currentValue":"latest","skipReason":"invalid-value"}]}]}}'
else
  printf '%s\n' '{"msg":"Extracted dependencies","packageFiles":{"mise":[{"packageFile":"mise.toml","deps":[{"depName":"example","currentValue":"latest"}]}]}}'
fi
'''
