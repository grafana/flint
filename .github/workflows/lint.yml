---
name: Lint

on:
  push:
    branches: [main] # warms the Rust cache so PR branches get a cache hit
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # needed for merge-base used in lint:links

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: v2026.11.7
          sha256: 8f5426d9971eaf713b37509749174ca69cf2f08b8b25e389168dcfcab9cd1a4d

      # mise may activate an existing Rust toolchain without adding missing components.
      - name: Install Rust lint components
        run: rustup component add clippy rustfmt

      - name: Restore cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run lint
