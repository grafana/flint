---
name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bare tag name to release (e.g. v0.20.0, not refs/tags/v0.20.0)"
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Artifact releases pair a focused tool allowlist with cache: false.
      MISE_ENABLE_TOOLS: rust

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            mise_version: v2026.8.2
            mise_sha256: 9a6c2a8b6fe77c98f1d210b4b3cbd2a0cf31886ad1baf10698757a3234c678c1
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.8.2
            mise_sha256: 9a6c2a8b6fe77c98f1d210b4b3cbd2a0cf31886ad1baf10698757a3234c678c1
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.8.2
            mise_sha256: 9a6c2a8b6fe77c98f1d210b4b3cbd2a0cf31886ad1baf10698757a3234c678c1
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.8.2
            mise_sha256: 9a6c2a8b6fe77c98f1d210b4b3cbd2a0cf31886ad1baf10698757a3234c678c1
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            mise_version: v2026.8.2
            mise_sha256: 7252a83e77f8a8526810b1882eb1d7865ffa55266ff48b71ab55473b3d567bc0
          - target: aarch64-apple-darwin
            runner: macos-latest
            mise_version: v2026.8.2
            mise_sha256: c36958065f7f4286d6edf7077247302cff1da77c81ada4fa9a3566c0ea87e200
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mise_version: v2026.8.2
            mise_sha256: f1d183d107991250829292543ea1de966b9e7bf2aa57ec730533d306f44978f9

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: ${{ matrix.mise_version }}
          sha256: ${{ matrix.mise_sha256 }}
          install_args: rust
          cache: false

      - name: Install cross
        if: matrix.build-tool == 'cross'
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cross

      - name: Build
        shell: bash
        run: ${{ matrix.build-tool || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Archive (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" flint
          # macOS ships shasum; Linux ships sha256sum
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.zip"
          7z a "$ARCHIVE" "./target/${{ matrix.target }}/release/flint.exe"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload to draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # gh release upload uses GET /releases/tags/{tag}, which returns 404
          # for draft releases. Use the list API to find the release instead.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Error: no release found for tag $TAG" >&2
            exit 1
          fi
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          for asset in "$ARCHIVE" "$ARCHIVE.sha256"; do
            ASSET_NAME=$(basename "$asset")
            # Delete pre-existing asset to support workflow re-runs
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$ASSET_NAME\") | .id" \
              | xargs -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE \
              || true
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=$ASSET_NAME" \
              --data-binary "@$asset"
          done

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "${GITHUB_REPOSITORY}"
