name: Mise registry compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: rust
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          version: v2026.7.12
          sha256: dad54e0b843908324282b8673f9c0ebc3a4da0c49ad2da309a49bfbc918ba180
          cache_key: "{{default}}-{{env.MISE_ENABLE_TOOLS}}"
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Validate curated tool backends
        run: mise run validate-mise-registry
