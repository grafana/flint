---
name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bare tag name to release (e.g. v0.20.0, not refs/tags/v0.20.0)"
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Artifact releases pair a focused tool allowlist with cache: false.
      MISE_ENABLE_TOOLS: rust

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            mise_version: v2026.10.23
            mise_sha256: a6ac620e73fb58cefbdfef8fb154856fbd8ae08d75ae88103e4b81daef3a836e
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.10.23
            mise_sha256: a6ac620e73fb58cefbdfef8fb154856fbd8ae08d75ae88103e4b81daef3a836e
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.10.23
            mise_sha256: a6ac620e73fb58cefbdfef8fb154856fbd8ae08d75ae88103e4b81daef3a836e
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.10.23
            mise_sha256: a6ac620e73fb58cefbdfef8fb154856fbd8ae08d75ae88103e4b81daef3a836e
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            mise_version: v2026.10.23
            mise_sha256: 9c439d85efca0a3529994fabe89de0098a6caae3b4f24e1492e51abc055873e6
          - target: aarch64-apple-darwin
            runner: macos-latest
            mise_version: v2026.10.23
            mise_sha256: 666b62cf0951b0a8ffccbfa832bfad8e19420d2bd5137b0458ce181f4225e835
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mise_version: v2026.10.23
            mise_sha256: 820e6399261eea81d4d167cfeb5b77aa4db4094033a3f6ed0bdf1a4b1b094e8c

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5
        with:
          version: ${{ matrix.mise_version }}
          sha256: ${{ matrix.mise_sha256 }}
          install_args: rust
          cache: false

      - name: Install cross
        if: matrix.build-tool == 'cross'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cross

      - name: Build
        shell: bash
        run: ${{ matrix.build-tool || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Archive (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" flint
          # macOS ships shasum; Linux ships sha256sum
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.zip"
          7z a "$ARCHIVE" "./target/${{ matrix.target }}/release/flint.exe"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Stage archive for release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          overwrite: true

      - name: Upload to draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # gh release upload uses GET /releases/tags/{tag}, which returns 404
          # for draft releases. Use the list API to find the release instead.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Error: no release found for tag $TAG" >&2
            exit 1
          fi
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          for asset in "$ARCHIVE" "$ARCHIVE.sha256"; do
            ASSET_NAME=$(basename "$asset")
            # Delete pre-existing asset to support workflow re-runs
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$ASSET_NAME\") | .id" \
              | xargs -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE \
              || true
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=$ASSET_NAME" \
              --data-binary "@$asset"
          done

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Collect release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve release source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sign and verify release manifest
        uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        with:
          tag: ${{ env.TAG }}
          commit: ${{ steps.source.outputs.commit }}
          artifacts: dist/flint-*.tar.gz dist/flint-*.zip
          bin: flint
          attest: link
          resources: |
            cli-spec/usage/flint=exec:flint usage
            skill/flint=repo:skills/flint
          out: dist
          upload: false

      - name: Upload manifest to draft release
        id: upload-manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use the list API: tag lookup may not find a draft release.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          test -n "$RELEASE_ID"
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "packslip.sigstore.json") | .id' \
            | xargs -r -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "${UPLOAD_URL}?name=packslip.sigstore.json" \
            --data-binary @dist/packslip.sigstore.json

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload-manifest.outputs.release-id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --method PATCH -F draft=false
