---
name: Release Management

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    # Runs on every push to main. If the release PR was just merged (i.e. Cargo.toml
    # version was bumped), creates a git tag and a draft GitHub release, then triggers
    # release.yml to build platform binaries and publish the release.
    name: Create Release
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'grafana/flint' }}
    env:
      MISE_ENABLE_TOOLS: release-plz
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: v2026.7.18
          sha256: e1fc2899f2bc7dfe9a3553f4c2d5944cf69d11b5f561545504a20f1e11cd6cc5
          cache_key: "{{default}}-{{env.MISE_ENABLE_TOOLS}}"
      - name: Create release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:create --git-token "$GITHUB_TOKEN"

  release-pr:
    # Runs on every push to main. Keeps an open PR that bumps Cargo.toml version
    # and updates CHANGELOG.md based on conventional commits since the last release.
    # Merging this PR triggers the release job above.
    # Depends on release so the new git tag exists before we compute the next version.
    name: Update Release PR
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'grafana/flint' }}
    env:
      MISE_ENABLE_TOOLS: release-plz
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: v2026.7.18
          sha256: e1fc2899f2bc7dfe9a3553f4c2d5944cf69d11b5f561545504a20f1e11cd6cc5
          cache_key: "{{default}}-{{env.MISE_ENABLE_TOOLS}}"
      - name: Update release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:pr --git-token "$GITHUB_TOKEN"
