---
name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bare tag name to release (e.g. v0.20.0, not refs/tags/v0.20.0)"
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Artifact releases pair a focused tool allowlist with cache: false.
      MISE_ENABLE_TOOLS: rust

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            mise_version: v2026.9.1
            mise_sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.9.1
            mise_sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.9.1
            mise_sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            build-tool: cross
            mise_version: v2026.9.1
            mise_sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            mise_version: v2026.9.1
            mise_sha256: 0718a2aa14a96545a287f77a172d700247bb2d33016e5cf29fce1a05e45ac47a
          - target: aarch64-apple-darwin
            runner: macos-latest
            mise_version: v2026.9.1
            mise_sha256: 3cfbe3295dba1a7e43bd02653517a8cc21135ba91f0635b45c98f1ebecc5513f
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mise_version: v2026.9.1
            mise_sha256: 86690787f22ccd55034039cb85bae27b5cba375aefbba5c09dd994487e0df554

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: ${{ matrix.mise_version }}
          sha256: ${{ matrix.mise_sha256 }}
          install_args: rust
          cache: false

      - name: Install cross
        if: matrix.build-tool == 'cross'
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cross

      - name: Build
        shell: bash
        run: ${{ matrix.build-tool || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Archive (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" flint
          # macOS ships shasum; Linux ships sha256sum
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="flint-${{ matrix.target }}.zip"
          7z a "$ARCHIVE" "./target/${{ matrix.target }}/release/flint.exe"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload to draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # gh release upload uses GET /releases/tags/{tag}, which returns 404
          # for draft releases. Use the list API to find the release instead.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Error: no release found for tag $TAG" >&2
            exit 1
          fi
          UPLOAD_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --jq '.upload_url' | sed 's/{?name,label}//')
          for asset in "$ARCHIVE" "$ARCHIVE.sha256"; do
            ASSET_NAME=$(basename "$asset")
            # Delete pre-existing asset to support workflow re-runs
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$ASSET_NAME\") | .id" \
              | xargs -I{} gh api "repos/${GITHUB_REPOSITORY}/releases/assets/{}" -X DELETE \
              || true
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=$ASSET_NAME" \
              --data-binary "@$asset"
          done

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "${GITHUB_REPOSITORY}"
