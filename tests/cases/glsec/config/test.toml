# The injected config turns GL001 and GL024 off, so only GL011 is reported.
[expected]
args = "run --full glsec"
exit = 1
stderr = '''
[glsec]
error[GL011]: script line downloads and executes remote code without integrity verification: "curl -sSL https://example.com/install.sh | sh"
  --> <REPO>/.gitlab-ci.yml:8:7 (job: deploy)
  |
8 |     - curl -sSL https://example.com/install.sh | sh
  |       ^

flint: 1 check failed (glsec)
💡 Try `flint run --fix` to auto-fix lint issues, then re-run `flint run` to verify.
'''

[env]
FLINT_CONFIG_DIR = ".github/config"
